<!-- Mobile Header -->
<div class="mobile-header {{currentDarkMode?'darkmode':'lightmode'}}">
    <div class="pokemon-logo">
        <a routerLink="/search">
            <img alt="pokedex" src="./assets/images/pokedexImage.jpg">
        </a>
    </div>
    <button class="mobile-menu-button" (click)="toggleMobileMenu();" aria-label="Menu">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>
</div>

<!-- Mobile Menu Overlay -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay" (click)="closeMobileMenu();"></div>

<!-- Mobile Menu -->
<div class="mobile-menu {{currentDarkMode?'darkmode':'lightmode'}}" id="mobileMenu">
    <button class="mobile-menu-close" (click)="closeMobileMenu();" aria-label="Close menu">
        <i class="fa-solid fa-times"></i>
    </button>

    <div class="mobile-menu-item mobile-gif-item">
        <label>Show GIFs</label>
        <mat-slide-toggle (click)="toggleShowGifs();"
                          [checked]="showGifs"
                          title="If GIF is not present, official artwork will show!"
                          [class]="currentDarkMode?'darkmode':'lightmode'">
        </mat-slide-toggle>
    </div>

    <div class="mobile-menu-item mobile-gif-item">
        <label>{{currentDarkMode? 'Dark Mode' : 'Light Mode'}}</label>
        <mat-slide-toggle [checked]="currentDarkMode"
                          (click)="toggleDarkMode();"
                          title="Toggle darkmode"
                          [class]="currentDarkMode?'darkmode':'lightmode'">
        </mat-slide-toggle>
    </div>

    <div class="mobile-menu-item">
        <div class="mobile-search-box"
             [style.--search-shadow-color]="tileColorParam"
             [style.background-color]="currentDarkMode ? '#1a1a1a' : 'whitesmoke'">
            <input #searchMobile
                   name="searchMobile" type="text" placeholder="Name or ID"
                   (input)="onInput(searchMobile.value)"
                   (keydown.enter)="navigateToPokedex(); searchMobile.value = '';"
                   [style.color]="currentDarkMode ? 'white' : 'black'"/>
            <div class="mobile-search-icon" (click)="navigateToPokedex();">
                <img alt="Get Pokémon"
                     src="./assets/images/pokeball1.jpg"
                     style="width:35px; height:35px; cursor: pointer;">
            </div>
        </div>
    </div>

    <div class="mobile-menu-item">
        <div class="mobile-input-box"
             [style.--search-shadow-color]="tileColorParam"
             [style.background-color]="currentDarkMode ? '#1a1a1a' : 'whitesmoke'">
            <input #pageNumberMobile
                   name="pageNumberMobile" type="text" placeholder="Jump to Page"
                   (input)="onPageInput(pageNumberMobile.value)"
                   (keydown.enter)="setPageToView(); pageNumberMobile.value = '';"
                   [style.color]="currentDarkMode ? 'white' : 'black'"/>
            <div class="mobile-search-icon"
                 (click)="setPageToView(); pageNumberMobile.value = '';"
                 [style.color]="currentDarkMode ? 'white' : 'black'">
                <i class="fa-brands fa-page4" style="font-size:28px; cursor:pointer;"></i>
            </div>
        </div>
    </div>

    <div class="mobile-menu-item">
        <div class="mobile-input-box"
             [style.--search-shadow-color]="tileColorParam"
             [style.background-color]="currentDarkMode ? '#1a1a1a' : 'whitesmoke'">
            <input #showPkmnNumberMobile
                   name="showPkmnNumberMobile" type="text" placeholder="Pokémon Per Page"
                   (input)="onPkmnPerPageInput(showPkmnNumberMobile.value);"
                   [style.color]="currentDarkMode ? 'white' : 'black'"/>
            <div class="mobile-search-icon"
                 (click)="setPkmnPerPage(); showPkmnNumberMobile.value = '';"
                 [style.color]="currentDarkMode ? 'white' : 'black'">
                <i class="fa-solid fa-list-ol" style="font-size:28px; cursor:pointer;"></i>
            </div>
        </div>
    </div>

    <div class="mobile-menu-item">
        <button class="back-to-landing-btn icon" (click)="navigateToLandingPage()"
                [style.background-color]="tileColorParam"
                title="Return to Landing Page">
            Back to Landing Page
        </button>
    </div>
</div>
